<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PvZ OL · Localhost</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="icon-defs" aria-hidden="true"><defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M11 6.5h6M11 17.5h6"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="5" rx="1"/><path d="M5 8v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8M9 12h6"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9.5 3-.7 2.1-2 .9-2.1-.4-2.5 4.3 1.4 1.6v2l-1.4 1.6 2.5 4.3 2.1-.4 2 .9.7 2.1h5l.7-2.1 2-.9 2.1.4 2.5-4.3-1.4-1.6v-2l1.4-1.6-2.5-4.3-2.1.4-2-.9-.7-2.1Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 13a9 9 0 0 1-10-10A9 9 0 1 0 21 13Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V3H3v13h5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-14-3L3 8m0-5v5h5M4 16a8 8 0 0 0 14 3l3-3m0 5v-5h-5"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 3h7v7m0-7L10 14M10 3H3v18h18v-7"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v5h16v-5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 3 7v5c0 5 9 9 9 9s9-4 9-9V7Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3C10 1 2 7 4 15c2 8 17 5 16-12ZM4 21 15 10"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10v.01"/></symbol>
  </defs></svg>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#home" aria-label="PvZ OL Homepage"><span class="launcher-mark"><svg><use href="#i-leaf"/></svg></span><span><strong>PVZ OL</strong><small>Plants vs. Zombies</small></span></a>
      <nav class="navigation" aria-label="Main Navigation">
        <a href="#home" data-page="home"><svg><use href="#i-home"/></svg><span>Home</span></a>
        <a href="#accounts" data-page="accounts"><svg><use href="#i-user"/></svg><span>Accounts</span></a>
        <a href="#gm" data-page="gm"><svg><use href="#i-grid"/></svg><span>Save Editor</span></a>
        <a href="#services" data-page="services"><svg><use href="#i-server"/></svg><span>Services</span></a>
        <a href="#backups" data-page="backups"><svg><use href="#i-archive"/></svg><span>Backups</span></a>
        <a href="#settings" data-page="settings"><svg><use href="#i-settings"/></svg><span>Settings</span></a>
      </nav>
      <div class="sidebar-bottom"><span class="sidebar-version">PVZ OL GUI <span>2.0</span></span></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><h1 id="breadcrumbPage">首页</h1><div class="topbar-actions"><span id="demoBadge" class="demo-badge" hidden>只读演示</span><span id="connectionBadge" class="connection-badge"><i></i>正在连接</span><button id="themeToggle" class="icon-button" title="Switch between Light and Dark themes" aria-label="Switch between light and dark themes"><svg><use href="#i-sun"/></svg></button></div></header>
      <main id="main" tabindex="-1"></main>
    </div>
  </div>
  <div id="toastRegion" class="toast-region" role="status" aria-live="polite"></div>
  <dialog id="appDialog" class="app-dialog"><div id="dialogBody"></div></dialog>
  <input id="avatarUpload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
  <script src="app.js"></script>
</body>
</html>
